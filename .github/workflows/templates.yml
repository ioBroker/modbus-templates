name: Templates

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: templates-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Pull requests: the changed files must be valid. Old problems in other files do not block a contribution.
    validate:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm test
            - name: Validate changed files
              run: |
                  git diff --name-only -z --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
                    | xargs -0 -r node scripts/templates.mjs validate
            - name: Report of all files (does not fail)
              if: always()
              run: node scripts/templates.mjs validate --quiet || true

    # main: rebuild templates.json, so contributors never have to run a script themselves
    index:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm test
            - run: node scripts/templates.mjs build --quiet
            - name: Commit templates.json
              run: |
                  if [ -n "$(git status --porcelain -- templates.json)" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add templates.json
                    git commit -m "chore: update templates.json [skip ci]"
                    git push
                  fi
